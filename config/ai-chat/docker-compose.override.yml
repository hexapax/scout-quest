services:
  api:
    container_name: ai-chat-api
    mem_limit: 512m   # cap: contain runaway -> cgroup OOM (alertable), not whole-box OOM
    volumes:
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
      - type: bind
        source: ./mcp-servers
        target: /app/mcp-servers
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - default
      - scout-shared
    depends_on:
      - mongodb

  mongodb:
    container_name: ai-chat-mongodb
    image: mongo:8.0.34
    mem_limit: 512m   # raise if WiredTiger cache grows (container-OOM alert will flag it)
    networks:
      - default
      - scout-shared

  meilisearch:
    container_name: ai-chat-meilisearch
    image: getmeili/meilisearch:v1.55.0
    volumes:
      # new data dir per meili version; LibreChat re-syncs the index from Mongo on start
      - ./meili_data_v1.55.0:/meili_data
    mem_limit: 256m

  vectordb:
    container_name: ai-chat-vectordb
    image: pgvector/pgvector:0.8.7-pg15-trixie
    mem_limit: 256m

  rag_api:
    container_name: ai-chat-rag-api
    mem_limit: 256m

networks:
  scout-shared:
    external: true
    name: scout-shared
